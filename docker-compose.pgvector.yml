services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: conversation_tree
      POSTGRES_USER: conversation_tree
      POSTGRES_PASSWORD: conversation_tree
    ports:
      - "5432:5432"
    volumes:
      - conversation_tree_pgdata:/var/lib/postgresql/data

volumes:
  conversation_tree_pgdata:
